[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-reaction-role-manager"
version = "1.0.0"
description = "One-shot CLI for adding or removing a Discord role from message reactors and poll voters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jigyasu Patel" }]
dependencies = [
  "discord.py>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
discord-role-manager = "discord_role_manager.cli:main"

[tool.setuptools.packages.find]
include = ["discord_role_manager*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

